# Runs the whole UNRET demo:  docker compose up --build
#   Website:            http://localhost:3000
#   Mobile app (web):   http://localhost:8081
#   API + docs:         http://localhost:4000/api/docs
# Demo password for all seeded accounts: Unret-demo-2026!
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: unret
      POSTGRES_PASSWORD: unret
      POSTGRES_DB: unret
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unret"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7

  # Daily database backup (support records, conversations, jobs, payments…) into ./backups, kept 30 days.
  # Copy ./backups to another place too (another server or cloud storage): a backup on the same disk is not enough.
  db-backup:
    image: postgres:16
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: unret
      PGPASSWORD: unret
      PGDATABASE: unret
      BACKUP_KEEP_DAYS: "30"
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/backup-db.sh:ro
    entrypoint: ["/bin/sh", "/backup-db.sh"]
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://unret:unret@postgres:5432/unret?schema=public
      REDIS_URL: redis://redis:6379
      # Demo-only secrets. Generate real random values for any shared or public deployment.
      JWT_ACCESS_SECRET: demo-access-secret-change-me
      JWT_REFRESH_SECRET: demo-refresh-secret-change-me
      FILE_SIGNING_SECRET: demo-file-secret-change-me
      STORAGE_DIR: /data/uploads
      PUBLIC_API_URL: ""
      WEB_ORIGIN: http://localhost:3000,http://localhost:8081
      # Payments: "mock" simulates payments. For Stripe, put these in a .env file next to this file (see docs/payments.md).
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      # Email: by default every email goes to the local Mailpit inbox (http://localhost:8025).
      # For real delivery set SMTP_* in a .env file next to this file (see docs/email.md).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-UNRET <no-reply@unret.ro>}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    volumes: [uploads:/data/uploads]
    ports: ["4000:4000"]

  # Catches all emails locally so you can read them in the browser: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]

  web:
    build: { context: ., target: web }
    depends_on: [api]
    ports: ["3000:3000"]

  mobile-web:
    build: { context: ., target: mobile-web }
    depends_on: [api]
    ports: ["8081:8081"]

volumes:
  pgdata:
  uploads:
