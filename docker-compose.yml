# Runs the whole UNRET demo:  docker compose up --build
#   Website:            http://localhost:3000
#   Mobile app (web):   http://localhost:8081
#   API + docs:         http://localhost:4000/api/docs
# Demo password for all seeded accounts: Unret-demo-2026!
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: unret
      POSTGRES_PASSWORD: unret
      POSTGRES_DB: unret
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unret"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7

  api:
    build: { context: ., target: api }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://unret:unret@postgres:5432/unret?schema=public
      REDIS_URL: redis://redis:6379
      # Demo-only secrets. Generate real random values for any shared or public deployment.
      JWT_ACCESS_SECRET: demo-access-secret-change-me
      JWT_REFRESH_SECRET: demo-refresh-secret-change-me
      FILE_SIGNING_SECRET: demo-file-secret-change-me
      STORAGE_DIR: /data/uploads
      PUBLIC_API_URL: ""
      WEB_ORIGIN: http://localhost:3000,http://localhost:8081
      PAYMENT_PROVIDER: mock
    volumes: [uploads:/data/uploads]
    ports: ["4000:4000"]

  web:
    build: { context: ., target: web }
    depends_on: [api]
    ports: ["3000:3000"]

  mobile-web:
    build: { context: ., target: mobile-web }
    depends_on: [api]
    ports: ["8081:8081"]

volumes:
  pgdata:
  uploads:
